<!doctype html>
<html lang="sv" class="dark" style="color-scheme: dark; background-color: #11151d">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#11151d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MittPsyke" />
    <meta name="ahrefs-site-verification" content="946a8ac0fc228ee9187b2fa72e3acf033de144bf52409cc3cf6ca5c2c65e7aea" />
    <meta name="hibp-verify" content="dweb_4fihkcv6jbhi341se2nuoxxx" />
    <link rel="icon" type="image/png" href="/logo-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
    <link rel="preload" href="%sveltekit.assets%/assets/recursive/fonts/recursive-t/RecursiveT-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="%sveltekit.assets%/assets/recursive/fonts.css" />
    <style>
      html,
      body {
        background-color: #11151d;
        color: #f2f2f2;
        color-scheme: dark;
      }
    </style>
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('mittpsyke:theme');
          if (theme) {
            var themes = {
              neutral:    { a: '#436e8f', b: 'rgba(67, 110, 143, 0.08)' },
              salvia:     { a: '#5f7fa5', b: 'rgba(95, 127, 165, 0.09)' },
              'havsbl\u00e5':    { a: '#5b8db8', b: 'rgba(91, 141, 184, 0.09)' },
              lavendel:   { a: '#8b7ab8', b: 'rgba(139, 122, 184, 0.09)' },
              sand:       { a: '#b8956a', b: 'rgba(184, 149, 106, 0.09)' },
              'skogsgr\u00f6n': { a: '#395d84', b: 'rgba(57, 93, 132, 0.09)' }
            };
            var t = themes[theme];
            if (t) {
              var s = document.documentElement.style;
              s.setProperty('--primary', t.a);
              s.setProperty('--theme-accent', t.a);
              s.setProperty('--theme-bg', t.b);
            }
          }
        } catch(e) {}
      })();
    </script>
    <script type="text/plain" id="ga-verification" data-src="https://www.googletagmanager.com/gtag/js?id=G-8XG01VCB5N">
      gtag('config', 'G-8XG01VCB5N');
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-prerender="false">
    <div style="display:contents">%sveltekit.body%</div>
  </body>
</html>
