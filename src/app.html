<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="ahrefs-site-verification" content="946a8ac0fc228ee9187b2fa72e3acf033de144bf52409cc3cf6ca5c2c65e7aea" />
    <meta name="hibp-verify" content="dweb_4fihkcv6jbhi341se2nuoxxx" />
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="any" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" type="image/png" sizes="96x96" />
    <link rel="icon" href="%sveltekit.assets%/favicon-96x96.png" type="image/png" sizes="96x96" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
    <link rel="stylesheet" href="%sveltekit.assets%/assets/recursive/fonts.css" />
    <script src="https://analytics.ahrefs.com/analytics.js" data-key="XG5Lo0Q/lYLzWqNByIXjLQ" async></script>
    <script>
      // Flash prevention: apply theme before first paint
      (function() {
        try {
          var mode = localStorage.getItem('theme-mode');
          var isDark = mode === 'dark';
          document.documentElement.classList.toggle('dark', isDark);
          var theme = localStorage.getItem('mittpsyke:theme');
          if (theme) {
            var themes = {
              neutral:    { a: '#436e8f', b: 'rgba(67, 110, 143, 0.08)' },
              salvia:     { a: '#5f7fa5', b: 'rgba(95, 127, 165, 0.09)' },
              'havsbl\u00e5':    { a: '#5b8db8', b: 'rgba(91, 141, 184, 0.09)' },
              lavendel:   { a: '#8b7ab8', b: 'rgba(139, 122, 184, 0.09)' },
              sand:       { a: '#b8956a', b: 'rgba(184, 149, 106, 0.09)' },
              'skogsgr\u00f6n': { a: '#395d84', b: 'rgba(57, 93, 132, 0.09)' }
            };
            var t = themes[theme];
            if (t) {
              var s = document.documentElement.style;
              s.setProperty('--primary', t.a);
              s.setProperty('--theme-accent', t.a);
              s.setProperty('--theme-bg', t.b);
            }
          }
        } catch(e) {}
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-prerender="false">
    <div style="display:contents">%sveltekit.body%</div>
  </body>
</html>
