name: Reindex search embeddings

on:
  schedule:
    # Kör en gång per natt så att nytt/ändrat innehåll (artiklar, guider, FAQ)
    # blir sökbart inom ett dygn. Endpointen är inkrementell - oförändrat
    # innehåll embeddas inte om, så det här är billigt även vid daglig körning.
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  reindex:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger search reindex
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.MITTPSYKE_SITE_URL || 'https://mittpsyke.se' }}
        run: |
          curl --fail --show-error --silent \
            --request POST \
            --header "x-cron-secret: $CRON_SECRET" \
            "$SITE_URL/api/cron/reindex-search"
