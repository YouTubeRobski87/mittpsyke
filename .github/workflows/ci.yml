name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: AI Evaluation Suite
        run: npm run ai:eval
        env:
          AI_EVAL_REPORT_PATH: artifacts/ai-evaluation-report.md
      - name: Upload AI evaluation report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ai-evaluation-report
          path: artifacts/ai-evaluation-report.md
          if-no-files-found: warn
      - run: npm run check
      # Säkerhetstestet för dagbokens HTML-sanering kräver riktig Chromium och
      # körs därför här, inte i produktionsbygget (Render saknar Chrome). Steget
      # blir rött om Chrome saknas, om filtret inte hittar testet eller om en
      # assertion fallerar. Versionsraden visar i loggen att Chrome faktiskt fanns.
      - name: Chromium security test (DOMPurify)
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          "$CHROME_BIN" --version
          npm run test:browser
      # prebuild kör test:unit, dvs alla tester utom webbläsartesterna ovan.
      - run: npm run build
