name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: AI Evaluation Suite
        run: npm run ai:eval
        env:
          AI_EVAL_REPORT_PATH: artifacts/ai-evaluation-report.md
      - name: Upload AI evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-evaluation-report
          path: artifacts/ai-evaluation-report.md
          if-no-files-found: warn
      - run: npm run check
      - run: npm run build
