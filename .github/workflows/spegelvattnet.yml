name: Spegelvattnet weekly reflection

on:
  schedule:
    # Run both possible UTC hours for 06:00 Europe/Stockholm.
    # The endpoint itself checks Swedish local time, so DST is handled there.
    - cron: '0 4,5 * * 0'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger weekly reflections
        run: |
          curl --fail --show-error --silent \
            --request POST \
            --header "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "${{ vars.MITTPSYKE_SITE_URL || 'https://www.mittpsyke.se' }}/api/cron/spegelvattnet"
