name: Guest chat cleanup (manual only)

on:
  # Automatisk radering är avstängd under incidentbedömningen den 9 augusti 2026.
  # Kör inte detta manuellt utan uttryckligt beslut om att radering får ske.
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger guest data cleanup
        run: |
          curl --fail --show-error --silent \
            --request POST \
            --header "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "${{ vars.MITTPSYKE_SITE_URL || 'https://mittpsyke.se' }}/api/cron/guest-cleanup"
