name: Guest chat cleanup (manual only)

on:
  # Automatisk radering är avstängd under incidentbedömningen den 9 augusti 2026.
  # Kör inte detta manuellt utan uttryckligt beslut om att radering får ske.
  workflow_dispatch:

permissions: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger guest data cleanup
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.MITTPSYKE_SITE_URL || 'https://mittpsyke.se' }}
        run: |
          curl --fail --show-error --silent \
            --request POST \
            --header "x-cron-secret: $CRON_SECRET" \
            "$SITE_URL/api/cron/guest-cleanup"
