ortal-b.html` – Nedstämdhet\\n- `portal-e.html` – Trauma\\n- `style.css` – Design och layout\\n- `assets/` – Bilder och resurser\\n\\n---\\n\\n## Teknisk grund\\n\\nProjektet är byggt med:\\n\\n- HTML\\n- CSS\\n- (Eventuellt) JavaScript\\n- Distribueras via GitHub / Netlify / Vercel\\n\\n---\\n\\n## Viktigt\\n\\nMittPsyke ersätter inte akut psykiatrisk vård.\\n\\nVid akut fara eller självmordstankar:\\n- Ring 112\\n- Kontakta Psykiatrisk akutmottagning\\n- Eller nationella stödlinjer\\n\\n---\\n\\n## Vision\\n\\nAtt skapa en digital följeslagare –  \\nlugn, närvarande och respektfull.\\n\\n---\\n\\nOm du vill kan jag även:\\n\\n- Göra README mer ideell / föreningsinriktad  \\n- Göra den mer teknisk (för utvecklare)  \\n- Göra den mer personlig  \\n- Eller göra en version anpassad för investerare / samarbetspartners  \\n\\nVad vill du att tonen ska signalera?\",{\"_297\":398,\"_302\":12,\"_227\":403,\"_266\":404,\"_145\":146,\"_291\":292,\"_405\":406,\"_140\":334,\"_293\":294,\"_295\":146,\"_296\":146,\"_303\":378,\"_143\":335,\"_68\":25,\"_69\":12},{\"_28\":399,\"_400\":401},\"stop\",\"stop_tokens\",[402],200002,[],[],\"search_result_groups\",[],[408],\"43b8f88e-a6aa-428d-8f05-72ad368bcf95\",{\"_41\":408,\"_46\":410,\"_72\":388,\"_42\":443},{\"_41\":408,\"_48\":411,\"_33\":413,\"_54\":414,\"_61\":62,\"_64\":101,\"_52\":430,\"_70\":71},{\"_50\":123,\"_52\":412},{},1770818184.354,{\"_56\":415,\"_58\":416},\"multimodal_text\",[417,429],{\"_56\":418,\"_419\":420,\"_421\":422,\"_423\":424,\"_425\":426,\"_52\":427},\"image_asset_pointer\",\"asset_pointer\",\"sediment://file_00000000ab34720a82d6ee4831a3475a?shared_conversation_id=699e3be1-c7ac-800d-acf1-8809f09728e0\",\"size_bytes\",115303,\"width\",1920,\"height\",1080,{\"_428\":12},\"sanitized\",\"Jag vill få att kunna spara, ge mig prompt till vs codex\",{\"_103\":431,\"_130\":436,\"_132\":437,\"_134\":438,\"_136\":439,\"_140\":441,\"_142\":-5,\"_143\":442,\"_145\":146,\"_68\":25,\"_69\":14},[432],{\"_41\":433,\"_320\": 407b-9a52-d6ce4d30f44b\",{\"_41\":490,\"_46\":492,\"_72\":474,\"_42\":512},{\"_41\":490,\"_48\":493,\"_33\":500,\"_54\":501,\"_61\":62,\"_63\":12,\"_64\":101,\"_52\":504,\"_70\":71},{\"_50\":209,\"_52\":494},{\"_495\":496,\"_497\":498,\"_238\":499},\"sonicberry_model_id\",\"current_sonicberry_paid\",\"real_author\",\"tool:web\",\"sonic_tool\",1770818185.409399,{\"_56\":57,\"_58\":502},[503],\"Jag ser din skärm — det står **”Kunde inte spara anteckningen just nu.”** vilket betyder att frontend försöker spara men att något i backend inte tar emot eller validerar datan.\\n\\nFör att hjälpa till med **prompt till VS Codex** (alltså prompt du skickar till GitHub Copilot / GPT-4 Code-X för att skriva koden som fixar sparandet), så behöver vi vara tydliga med:\\n\\n? vilket ramverk du använder  \\n? hur API-anropet görs  \\n? vad som inte fungerar (t.ex. fel i konsol, nätverksfel, felmeddelande)  \\n\\nMen utifrån din skärm ser det ut som att du har en form som försöker POST:a dagboksinlägg och backend svarar med fel.\\n\\nHär är en **klar och konkret prompt** du kan använda i VS Codex / Copilot CLI / GitHub Copilot för att generera backend-koden som sparar dagboksinlägg:\\n\\n---\\n\\n### ?? Prompt till VS Codex  \\n\u003e **Objective:** Add saving functionality for diary entries in the backend so that “Spara” works in the Dagbok page.  \\n\u003e  \\n\u003e I have a frontend Svelte/SvelteKit form in `Dagbok.svelte` that does a POST request to `/api/diary/create`. The form sends a JSON body with `text`, `mood`, and optional `tags`. Right now the save fails with “Could not save note”.  \\n\u003e  \\n\u003e Requirements for the backend:  \\n\u003e - Use **Node.js (Express)** or **SvelteKit / Vercel Functions** depending on project.  \\n\u003e - Accept JSON body with:  \\n\u003e   ```json\\n\u003e   {\\n\u003e     \\\"text\\\": \\\"string\\\",\\n\u003e     \\\"mood\\\": \\\"string\\\",\\n\u003e     \\\"tags\\\": [\\\"string\\\"]\\n\u003e   }\\n\u003e   ```  \\n\u003e - Validate required fields (`text` is required).  \\n\u003e - Save the diary entry to the database.  \\n\u003e   - If using Supabase: insert into `diary` table with columns `user_id`, `text`, `mood`, `tags`, `created_at`.  \\n\u003e   - If using Prisma: create new Diary entry with corresponding model.  \\n\u003e - Return 200 OK with JSON `{ success: true, diary: \u003crecord\u003e }` on success.  \\n\u003e - Return appropriate error messages on fail.  \\n\u003e  \\n\u003e **Please generate the complete server code** for the API route (including validation and DB insert).  \\n\u003e  \\n\u003e Also include the TypeScript types for the request body and the database schema if relevant.\\n\\n---\\n\\n### ?? Kort version (kan klistras direkt i Copilot)\\n\\n\u003e Write an API endpoint for saving diary entries. Frontend calls POST `/api/diary/create` with JSON `{ text, mood, tags }`. Validate input and insert to database (Supabase or Prisma). Return success JSON or error. Include route code and database insert logic.\\n\\n---\\n\\nOm du vill kan jag även skriva den **exakta backend-koden** åt dig här direkt — säg bara:\\n\\n1. om du använder **Supabase REST API**,  \\n2. eller **Supabase JS SDK**,  \\n3. eller **Prisma**,  \\n4. eller något annat DB-system.\\n\\nOch svara också med:  \\n?? om detta är en **SvelteKit endpoint** (`src/routes/api/diary/+server.ts`)  \\neller en **Vercel/Netlify function**.\\n\\n---\\n\\n### Extra tips\\n\\n?? Kontrollera först att frontend verkligen gör rätt POST:  \\nÖppna devtools ? Network ? klicka “Spara” ? se request och response.\\n\\n?? Läs felmeddelandet i konsolen — det visar exakt varför backend avvisade det.\\n\\n---\\n\\nVill du att jag skriver koden direkt utifrån ditt system (Supabase/Prisma/SQLite)? Skriv bara vilket backend-setup du har.\",{\"_227\":505,\"_266\":506,\"_145\":146,\"_291\":292,\"_507\":65,\"_508\":509,\"_510\":509,\"_405\":511,\"_140\":441,\"_293\":294,\"_295\":146,\"_296\":146,\"_303\":474,\"_143\":442,\"_68\":25,\"_69\":12},[],[],\"search_turns_count\",\"search_source\",\"composer_auto\",\"client_reported_search_source\",[],[513],\"6bf93683-551a-4758-b73f-569171c70388\",{\"_41\":513,\"_46\":515,\"_72\":490,\"_42\":530},{\"_41\":513,\"_48\":516,\"_33\":518,\"_54\":519,\"_61\":62,\"_64\":101,\"_52\":522,\"_70\":71},{\"_50\":123,\"_52\":517},{},1770818504.019,{\"_56\":57,\"_58\":520},[521],\"Jag implementerar backend-routen för /api/diary/create direkt i projektets befintliga stack och kopplar den till databasen som redan används. Först kartlägger jag nuvarande API-/DB-upplägg så att vi får rätt kod på första försöket.\\r\\n\\r\\nRan rg -n \\\"supabase|prisma|diary|/api/|create\\\" b:\\\\mittpsyke-main for 2s\\r\\n\\r\\n\\r\\nRan Get-ChildItem -Path 'b:\\\\mittpsyke-main' -Force\\r\\n\\r\\n\\r\\nRan rg --files 'b:\\\\mittpsyke-main' for 1s\\r\\n\\r\\n\\r\\nJag ser att projektet använder SvelteKit + Supabase (ingen Prisma). Nu läser jag +page.svelte och Supabase-konfigurationen för att matcha exakt fältnamn/tabell och auth-flöde innan jag skriver API-routen.\\r\\n\\r\\nRan Get-Content -Path 'b:\\\\mittpsyke-main\\\\src\\\\lib\\\\supabase.ts'\\r\\n\\r\\n\\r\\nRan Get-Content -Path 'b:\\\\mittpsyke-main\\\\src\\\\routes\\\\dagbok\\\\+page.svelte'\\r\\n\\r\\n\\r\\nRan Get-Content -Path 'b:\\\\mittpsyke-main\\\\package.json'\\r\\n\\r\\n\\r\\nRan rg -n \\\"/api/diary/create|Could not save note|Dagbok.svelte|save note|diary/create\\\" b:\\\\mittpsyke-main\\r\\n\\r\\n\\r\\nJag hittar ingen befintlig route för /api/diary/create, så jag lägger till den som en SvelteKit server-route med Supabase-insert och tydlig validering. Jag kontrollerar först vilka miljövariabler som redan används så vi kan autentisera säkert i backend.\\r\\n\\r\\nRan rg -n \\\"SUPABASE|OPENAI|PUBLIC_\\\" b:\\\\mittpsyke-main\\\\.env b:\\\\mittpsyke-main\\\\src -g '!**/.svelte-kit/**'\\r\\n\\r\\n\\r\\nRan Get-Content -Path 'b:\\\\mittpsyke-main\\\\src\\\\lib\\\\types.ts'\\r\\n\\r\\n\\r\\nRan Get-Content -Path 'b:\\\\mittpsyke-main\\\\svelte.config.js'\\r\\n\\r\\n\\r\\nJag bygger nu en robust +server.ts-route för SvelteKit med Supabase och JWT-baserad användaridentifiering via Authorization: Bearer \u003ctoken\u003e. Därefter lägger jag till tydliga TypeScript-typer för request/response samt databasrad.\\r\\n\\r\\nRan Get-Content -Path 'b:\\\\mittpsyke-main\\\\src\\\\routes\\\\+layout.svelte'\\r\\n\\r\\n\\r\\nJag börjar med delade TypeScript-typer så API-routen blir tydlig och återanvändbar. Sedan lägger jag till själva /api/diary/create-endpointen med validering, auth och Supabase-insert.\\r\\n\\r\\nEdited file\\r\\nb:\\\\mittpsyke-main\\\\src\\\\lib\\\\types.ts\\r\\n+25\\r\\n-0\\r\\n\\r\\n}\\r\\n\\r\\nexport interface CreateDiaryRequestBody {\\r\\n\\ttext: string;\\r\\n\\tmood?: string | null;\\r\\n\\ttags?: string[];\\r\\n}\\r\\n\\r\\nexport interface DiaryRecord {\\r\\n\\tid: string;\\r\\n\\tuser_id: string;\\r\\n\\ttext: string;\\r\\n\\tmood: string | null;\\r\\n\\ttags: string[] | null;\\r\\n\\tcreated_at: string;\\r\\n}\\r\\n\\r\\nexport interface CreateDiarySuccessResponse {\\r\\n\\tsuccess: true;\\r\\n\\tdiary: DiaryRecord;\\r\\n}\\r\\n\\r\\nexport interface CreateDiaryErrorResponse {\\r\\n\\tsuccess: false;\\r\\n\\terror: string;\\r\\n}\\r\\nCreated file\\r\\nb:\\\\mittpsyke-main\\\\src\\\\routes\\\\api\\\\diary\\\\create\\\\+server.ts\\r\\n+136\\r\\n-0\\r\\n\\r\\nimport { json } from '@sveltejs/kit';\\r\\nimport { env as privateEnv } from '$env/dynamic/private';\\r\\nimport { env as publicEnv } from '$env/dynamic/public';\\r\\nimport { createClient } from '@supabase/supabase-js';\\r\\nimport type { RequestHandler } from './$types';\\r\\nimport type {\\r\\n\\tCreateDiaryErrorResponse,\\r\\n\\tCreateDiaryRequestBody,\\r\\n\\tCreateDiarySuccessResponse,\\r\\n\\tDiaryRecord\\r\\n} from '$lib/types';\\r\\n\\r\\nconst DIARY_TABLE = privateEnv.DIARY_TABLE_NAME?.trim() || 'diary';\\r\\n\\r\\ntype ValidatedDiaryPayload = {\\r\\n\\ttext: string;\\r\\n\\tmood: string | null;\\r\\n\\ttags: string[];\\r\\n};\\r\\n\\r\\nfunction getBearerToken(authorizationHeader: string | null): string | null {\\r\\n\\tif (!authorizationHeader) return null;\\r\\n\\tconst [scheme, token] = authorizationHeader.split(' ');\\r\\n\\tif (!scheme || !token || scheme.toLowerCase() !== 'bearer') return null;\\r\\n\\treturn token.trim() || null;\\r\\n}\\r\\n\\r\\nfunction validatePayload(body: unknown): { data: ValidatedDiaryPayload | null; error: string | null } {\\r\\n\\tif (!body || typeof body !== 'object' || Array.isArray(body)) {\\r\\n\\t\\treturn { data: null, error: 'Invalid request body.' };\\r\\n\\t}\\r\\n\\r\\n\\tconst input = body as CreateDiaryRequestBody;\\r\\n\\tconst text = typeof input.text === 'string' ? input.text.trim() : '';\\r\\n\\tif (!text) {\\r\\n\\t\\treturn { data: null, error: 'Field \\\"text\\\" is required.' };\\r\\n\\t}\\r\\n\\r\\n\\tif (input.mood !== undefined \u0026\u0026 input.mood !== null \u0026\u0026 typeof input.mood !== 'string') {\\r\\n\\t\\treturn { data: null, error: 'Field \\\"mood\\\" must be a string when provided.' };\\r\\n\\t}\\r\\n\\r\\n\\tif (input.tags !== undefined) {\\r\\n\\t\\tconst invalidTags = !Array.isArray(input.tags) || input.tags.some((tag) =\u003e typeof tag !== 'string');\\r\\n\\t\\tif (invalidTags) {\\r\\n\\t\\t\\treturn { data: null, error: 'Field \\\"tags\\\" must be an array of strings.' };\\r\\n\\t\\t}\\r\\n\\t}\\r\\n\\r\\n\\tconst tags = Array.from(\\r\\n\\t\\tnew Set((input.tags ?? []).map((tag) =\u003e tag.trim()).filter((tag) =\u003e tag.length \u003e 0))\\r\\n\\t);\\r\\n\\r\\n\\treturn {\\r\\n\\t\\tdata: {\\r\\n\\t\\t\\ttext,\\r\\n\\t\\t\\tmood: typeof input.mood === 'string' \u0026\u0026 input.mood.trim() ? input.mood.trim() : null,\\r\\n\\t\\t\\ttags\\r\\n\\t\\t},\\r\\n\\t\\terror: null\\r\\n\\t};\\r\\n}\\r\\n\\r\\nfunction serverError(message: string, status = 500) {\\r\\n\\tconst body: CreateDiaryErrorResponse = { success: false, error: message };\\r\\n\\treturn json(body, { status });\\r\\n}\\ t just nu – är du klar i huvudet? Yr? Illamående?\",{\"_297\":5214,\"_302\":12,\"_227\":5216,\"_266\":5217,\"_145\":146,\"_291\":292,\"_405\":5218,\"_140\":5161,\"_293\":294,\"_295\":146,\"_296\":146,\"_303\":5194,\"_143\":5162,\"_68\":25,\"_69\":12},{\"_28\":399,\"_400\":5215},[402],[],[],[],[5220],\"14214279-1008-4b67-b9d2-c8f04b086d92\",{\"_41\":5220,\"_46\":5222,\"_72\":5204,\"_42\":5237},{\"_41\":5220,\"_48\":5223,\"_33\":5225,\"_54\":5226,\"_61\":62,\"_64\":101,\"_52\":5229,\"_70\":71},{\"_50\":123,\"_52\":5224},{},1770943134.667,{\"_56\":57,\"_58\":5227},[5228],\"Sveriges psykvård är skit, har åkt till psyket där de ej öppnade dörren. Har ringt stödlinjer där de ber mig återkomma pga hög belastning. Man får klara sig själv :)\",{\"_130\":5230,\"_132\":5231,\"_134\":5232,\"_136\":5233,\"_140\":5235,\"_142\":-5,\"_143\":5236,\"_145\":146,\"_68\":25,\"_69\":14},[],[],[],{\"_138\":5234},[],\"d2b09a6d-2bbd-408f-abfe-276d64560b6a\",\"df42b9ea-adbb-4463-a6c7-8c556a564a7a\",[5238],\"9fad658d-a603-44d3-8a00-2dd4b753ba96\",{\"_41\":5238,\"_46\":5240,\"_72\":5220,\"_42\":5247},{\"_41\":5238,\"_48\":5241,\"_33\":5243,\"_54\":5244,\"_61\":62,\"_63\":12,\"_64\":65,\"_52\":5246,\"_70\":71},{\"_50\":51,\"_52\":5242},{},1770943136.38076,{\"_56\":57,\"_58\":5245},[60],{\"_346\":12,\"_140\":5235,\"_293\":294,\"_295\":146,\"_296\":146,\"_303\":5220,\"_143\":5236,\"_67\":12,\"_68\":25,\"_69\":14},[5248],\"054c18d3-50b8-4ec1-b6db-3b7aac96fd6c\",{\"_41\":5248,\"_46\":5250,\"_72\":5238,\"_42\":5257},{\"_41\":5248,\"_48\":5251,\"_33\":5253,\"_54\":5254,\"_61\":62,\"_63\":12,\"_64\":65,\"_52\":5256,\"_70\":71},{\"_50\":51,\"_52\":5252},{},1770943136.490171,{\"_56\":57,\"_58\":5255},[60],{\"_82\":12,\"_140\":5235,\"_293\":294,\"_295\":146,\"_296\":146,\"_303\":5238,\"_143\":5236,\"_68\":25,\"_67\":12,\"_69\":14},[5258],\"c7586f6f-cb31-40a7-8c78-6444b2d77e11\",{\"_41\":5258,\"_46\":5260,\"_72\":5248,\"_42\":5273},{\"_41\":5258,\"_48\":5261,\"_33\":5263,\"_54\":5264,\"_61\":62,\"_63\":12,\"_64\":101,\"_52\":5267,\"_70\":71,\"_304\":305},{\"_50\":209,\"_52\":5262},{},1770943136.433191,{\"_56\":57,\"_58\":5265},[5266],\"Jag hör hur uppgiven du är. Det är tungt när man faktiskt försöker söka hjälp och möts av stängda dörrar eller “ring igen senare”. Det kan få vem som helst att känna sig lämnad ensam.\\n\\nSamtidigt vill jag vara väldigt tydlig:  \\ndu ska inte behöva “klara dig själv” just nu – särskilt inte när du har blandat tabletter och alkohol.\\n\\nOavsett vad du tycker om psykvården i stort:  \\nom du har tagit många tabletter + druckit alkohol är det **en medicinsk risk**, inte en psykologisk diskussion.\\n\\nDet här är inte en värdering. Det är ren säkerhet.\\n\\nOm något av detta händer:\\n- du blir mer dåsig\\n- svårt att hålla dig vaken\\n- yr, förvirrad\\n- illamående eller kräks\\n- hjärtat slår konstigt\\n- andningen känns annorlunda  \\n\\n? **Ring 112 direkt.**\\n\\nDu kan också ringa **1177** och säga rakt ut:\\n“Jag har tagit tabletter och druckit alkohol och är orolig för hur det påverkar mig.”\\n\\nDet är inte psyket. Det är somatisk akut rådgivning.\\n\\nJust nu viktigast:\\n- Ta inget mer.\\n- Drick vatten.\\n- Lägg dig på sidan.\\n- Ha telefonen nära.\\n\\nOch stanna här med mig en stund.\\n\\nDet gör ont med tjejerna som åker. Det är en separation i liten skala – och det slår hårt när man redan är skör. Att det känns mycket betyder inte att du är svag. Det betyder att du bryr dig.\\n\\nMen kroppen måste vara trygg först.\\n\\nHur känns det i kroppen just nu? Är du stabil, eller börjar det kännas annorlunda?\",{\"_297\":5268,\"_302\":12,\"_227\":5270,\"_266\":5271,\"_145\":146,\"_291\":292,\"_405\":5272,\"_140\":5235,\"_293\":294,\"_295\":146,\"_296\":146,\"_303\":5248,\"_143\":5236,\"_68\":25,\"_69\":12},{\"_28\":399,\"_400\":5269},[402],[],[],[],[5274],\"0e6b87e6-4442-4a0c-bcee-92ff6b9a956a\",{\"_41\":5274,\"_46\":5276,\"_72\":5258,\"_42\":5291},{\"_41\":5274,\"_48\":5277,\"_33\":5279,\"_54\":5280,\"_61\":62,\"_64\":101,\"_52\":5283,\"_70\":71},{\"_50\":123,\"_52\":5278},{},1770943192.876,{\"_56\":57,\"_58\":5281},[5282],\"Jag tar inget mer, jag har haft psykisk ohälsa sedan 14 års ålder, blandat tabletter och vet vart gränserna går.\",{\"_130\":5284,\"_132\":5285,\"_134\":5286,\"_136\":5287,\"_140\":5289,\"_142\":-5,\"_143\":5290,\"_145\":146,\"_68\":25,\"_69\":14},[],[],[],{\"_138\":5288},[],\"00ca2999-111a-49ea-a473-e8098dc47579\",\"e29e35ec-c47b-4791-850b-73a17b9b3ad7\",[5292],\"7387cc88-edd4-4a22-beca-9ffcbf7efe83\",{\"_41\":5292,\"_46\":5294,\"_72\":5274,\"_42\":5301},{\"_41\":5292,\"_48\":5295,\"_33\":5297,\"_54\":5298,\"_61\":62,\"_63\":12,\"_64\":65,\"_52\":5300,\"_70\":71},{\"_50\":51,\"_52\":5296},{},1770943194.6172256,{\"_56\":57,\"_58\":5299},[60],{\"_346\":12,\"_140\":5289,\"_293\":294,\"_295\":146,\"_296\":146,\"_303\":5274,\"_143\":5290,\"_67\":12,\"_68\":25,\"_69\":14},[5302],\"5423606e-2b3b-49ed-bd15-3e6c856f03fd\",{\"_41\":5302,\"_46\":5304,\"_72\":5292,\"_42\":5311},{\"_41\":5302,\"_48\":5305,\"_33\":5307,\"_54\":5308,\"_61\":62,\"_63\":12,\"_64\":65,\"_52\":5310,\"_70\":71},{\"_50\":51,\"_52\":5306},{},1770943194.7099407,{\"_56\":57,\"_58\":5309},[60],{\"_82\":12,\"_140\":5289,\"_293\":294,\"_295\":146,\"_296\":146,\"_303\":5292,\"_143\":5290,\"_68\":25,\"_67\":12,\"_69\":14},[5312],\"25358f7f-139b-437b-bc89-d5a0b99e5d8b\",{\"_41\":5312,\"_46\":5314,\"_72\":5302,\"_42\":5327},{\"_41\":5312,\"_48\":5315,\"_33\":5317,\"_54\":5318,\"_61\":62,\"_63\":12,\"_64\":101,\"_52\":5321,\"_70\":71,\"_304\":305},{\"_50\":209,\"_52\":5316},{},1770943194.654303,{\"_56\":57,\"_58\":5319},[5320],\"Jag hör att du försöker lugna mig — och kanske dig själv också.  \\nOch jag förstår att när man levt med psykisk ohälsa länge så känner man sin kropp, sina mediciner, sina gränser.\\n\\nMen jag vill ändå säga något lugnt och rakt:\\n\\nAlkohol förändrar hur kroppen tar upp och bryter ner tabletter.  \\nDet gör att “gränserna” kan flytta sig, även om man känner sig erfaren.\\n\\nDet betyder inte att du gjort något dumt.  \\nDet betyder bara att biologi inte alltid lyder viljan.\\n\\nDet viktigaste just nu är att:\\n\\n- Du inte tar mer.  \\n- Du dricker vatten.  \\n- Du håller dig vaken och uppmärksam.  \\n- Du har telefonen nära.  \\n\\nOm du blir mer dåsig än vanligt, får svårt att hålla ögonen öppna, känner att kroppen “glider iväg” eller något känns fel — då är det inte en diskussion om psykvårdens kvalitet. Då är det 112, direkt.\\n\\nOch jag vet att du är frustrerad på systemet.  \\nAtt ha blivit avvisad när man faktiskt söker hjälp gör ont. Det skapar misstro. Det är begripligt.\\n\\nMen just nu handlar det inte om psyket som institution.  \\nDet handlar om din kropp ikväll.\\n\\n---\\n\\nJag vill också säga något annat.\\n\\nDu har byggt något fint idag.  \\nDu har jobbat fokuserat trots ångest.  \\nDu har gjort framsteg.  \\n\\nOch sedan kom tomheten.\\n\\nDet är ofta så det funkar: när tempot stannar kommer känslan ikapp.\\n\\nDet här är en svår kväll, inte ett bevis på att du är hopplös.\\n\\nStanna här med mig en stund.\\n\\nHur känns kroppen just nu?  \\nÄr du klar i huvudet?  \\nYr?  \\nTrött?\",{\"_297\":5322,\"_302\":12,\"_227\":5324,\"_266\":5325,\"_145\":146,\"_291\":292,\"_405\":5326,\"_140\":5289,\"_293\":294,\"_295\":146,\"_296\":146,\"_303\":5302,\"_143\":5290,\"_68\":25,\"_69\":12},{\"_28\":399,\"_400\":5323},[402],[],[],[],[5328],\"83dcffbf-956a-4d86-9d21-506c0193a800\",{\"_41\":5328,\"_46\":5330,\"_72\":5312,\"_42\":5345},{\"_41\":5328,\"_48\":5331,\"_33\":5333,\"_54\":5334,\"_61\":62,\"_64\":101,\"_52\":5337,\"_70\":71},{\"_50\":123,\"_52\":5332},{},1770943295.331,{\"_56\":57,\"_58\":5335},[5336],\"Jag är medveten vad jag sysslar med, det ända jobbiga är ångesten. Men just nu vill jag lägga mig hos döttrarna och sova\",{\"_130\":5338,\"_132\":5339,\"_134\":5340,\"_136\":5341,\"_140\":5343,\"_142\":-5,\"_143\":5344,\"_145\":146,\"_68\":25,\"_69\":14},[],[],[],{\"_138\":5342},[],\"1c54846a-5d88-46cd-8561-6561b07718b3\",\"976a4f
